# Publisher Operations Portal - Nginx reverse proxy
# Place at /etc/nginx/sites-available/pop.conf and symlink into sites-enabled.

upstream pop_backend {
    # PM2 cluster mode load-balances internally, so a single upstream entry
    # pointing at the Node process port is sufficient.
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name pop.yourcompany.internal;

    # Redirect all HTTP to HTTPS in production.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pop.yourcompany.internal;

    ssl_certificate     /etc/ssl/certs/pop.crt;
    ssl_certificate_key /etc/ssl/private/pop.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30M;  # matches MAX_UPLOAD_SIZE_MB with headroom

    # Serve the built React frontend
    root /var/www/pop/frontend/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://pop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (Phase 3) - needs the Upgrade headers for websockets
    location /socket.io/ {
        proxy_pass http://pop_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded file access (invoices, catalogues, etc.) - served by the app,
    # not directly by Nginx, so auth/permission checks apply.
    location /api/files/ {
        proxy_pass http://pop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
